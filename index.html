<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dodge">
<meta name="theme-color" content="#0b0b1a">
<link rel="apple-touch-icon" sizes="180x180" href="icons/fox-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/fox-32.png">
<link rel="manifest" href="manifest.json">
<title>Dodge</title>
<style>
  :root {
    --bg: #0b0b1a;
    --panel: rgba(30, 26, 64, 0.94);
    --cyan: #3ef0ff;
    --gold: #ffd23f;
    --pink: #ff5c8a;
    --text: #f4f6ff;
    --dim: #8a8fb8;
    --font: -apple-system, "SF Pro Rounded", system-ui, sans-serif;
    --st: env(safe-area-inset-top);
    --sb: env(safe-area-inset-bottom);
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--text);
    font-family: var(--font);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100dvh; }
  #safe { position: fixed; visibility: hidden; pointer-events: none; padding-top: var(--st); padding-bottom: var(--sb); }
  svg { display: block; }

  /* Screens (menus) sit on top of the canvas. */
  .screen {
    position: fixed; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: calc(var(--st) + 16px) 20px calc(var(--sb) + 16px);
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
  }
  .screen { z-index: 5; }
  .screen.show { opacity: 1; pointer-events: auto; }
  .screen.dim { background: rgba(8, 8, 20, 0.6); }
  .topbar { position: absolute; top: calc(var(--st) + 14px); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; }

  .btn {
    border: 0; border-radius: 999px; width: 220px; padding: 16px 0; cursor: pointer;
    font: 800 20px/1 var(--font); letter-spacing: 1px; color: var(--bg); background: var(--cyan);
    box-shadow: 0 0 30px rgba(62, 240, 255, 0.45); transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.94); }
  .btn.ghost { background: rgba(255, 255, 255, 0.09); color: var(--text); box-shadow: none; }
  .btn.small { width: auto; padding: 10px 16px; font-size: 15px; }
  .btn.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 7px; border-radius: 999px;
    background: rgba(0, 0, 0, 0.35); font: 800 17px/1 var(--font); color: var(--gold);
  }
  .pill svg { width: 22px; height: 22px; }

  .title { font: 900 64px/1 var(--font); letter-spacing: 3px; text-shadow: 0 0 30px rgba(255, 92, 138, 0.7); margin: 0; }
  .sub { color: var(--dim); font: 600 15px/1.3 var(--font); margin: 0; text-align: center; }
  .hero { width: 140px; height: 140px; animation: bob 2.2s ease-in-out infinite; filter: drop-shadow(0 0 26px rgba(62, 240, 255, 0.45)); }
  @keyframes bob { 50% { transform: translateY(-12px) rotate(4deg); } }

  .card {
    background: var(--panel); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px;
    padding: 26px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: min(320px, 100%); box-sizing: border-box; transform: translateY(30px); transition: transform 0.3s cubic-bezier(.2, 1.4, .4, 1);
  }
  .screen.show .card { transform: none; }
  .label { font: 800 14px/1 var(--font); letter-spacing: 2px; color: var(--dim); }
  .big { font: 900 72px/1 var(--font); }
  .badge { background: var(--gold); color: var(--bg); font: 900 13px/1 var(--font); padding: 7px 14px; border-radius: 99px; }
  .install {
    position: absolute; bottom: calc(var(--sb) + 36px); left: 16px; right: 16px; display: none;
    background: rgba(62, 240, 255, 0.1); border: 1px solid rgba(62, 240, 255, 0.35); border-radius: 16px;
    padding: 12px 14px; font: 600 14px/1.4 var(--font); color: var(--text); text-align: center;
  }
  .install.show { display: block; }
  /* Keep menu content clear of the footer, and of the install tip when it shows. */
  #menu { padding-bottom: calc(var(--sb) + 30px); }
  #menu.hasTip { padding-bottom: calc(var(--sb) + 118px); }
  @media (max-height: 700px) {
    .hero { width: 104px; height: 104px; }
    .title { font-size: 50px; }
    #menu { gap: 10px; }
  }
  .footer {
    position: absolute; bottom: calc(var(--sb) + 10px); right: 14px;
    font: 500 11px/1 var(--font); color: var(--dim); opacity: 0.8;
  }
  .install b { color: var(--cyan); }
  .iconBtn {
    width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255, 255, 255, 0.09); display: flex; align-items: center; justify-content: center;
  }
  .iconBtn:active, .playBig:active { transform: scale(0.92); }
  .playBig {
    width: 96px; height: 96px; border-radius: 50%; border: 0; cursor: pointer; margin: 4px 0 6px;
    background: var(--cyan); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 36px rgba(62, 240, 255, 0.55); animation: pulse 1.6s ease-in-out infinite;
  }

  /* Settings. */
  .setting { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 700 16px/1.2 var(--font); }
  .setting.col { flex-direction: column; align-items: stretch; }
  .setting + .setting { border-top: 1px solid rgba(255, 255, 255, 0.07); padding-top: 14px; }
  .switch {
    width: 54px; height: 32px; border-radius: 99px; border: 0; padding: 0; cursor: pointer; position: relative;
    background: rgba(255, 255, 255, 0.15); transition: background 0.2s; flex: none;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
    background: #fff; transition: transform 0.2s;
  }
  .switch.on { background: var(--cyan); }
  .switch.on::after { transform: translateX(22px); }
  .seg { display: flex; background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 3px; }
  .seg button {
    flex: 1; border: 0; background: none; color: var(--dim); padding: 9px 0; border-radius: 9px; cursor: pointer;
    font: 700 14px/1 var(--font);
  }
  .seg button.on { background: var(--cyan); color: var(--bg); }
  .danger { color: var(--pink) !important; }
  .danger.armed { background: var(--pink) !important; color: #fff !important; }
  .version { color: var(--dim); font: 600 12px/1 var(--font); opacity: 0.6; }
  .hint { color: var(--cyan); font: 700 14px/1.3 var(--font); text-align: center; }
  .row { display: flex; gap: 18px; align-items: center; }

  /* Animal picker. */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(360px, 100%); }
  .animal {
    background: rgba(255, 255, 255, 0.06); border: 2px solid transparent; border-radius: 20px;
    padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font: 700 13px/1 var(--font); color: var(--text); cursor: pointer;
  }
  .animal svg { width: 68px; height: 68px; }
  .animal.locked svg { filter: grayscale(1) brightness(0.45); }
  .animal.selected { border-color: var(--cyan); background: rgba(62, 240, 255, 0.1); }
  .animal .world { font: 600 10px/1.1 var(--font); color: var(--dim); text-align: center; padding: 0 2px; }
  .animal .price { display: inline-flex; align-items: center; gap: 3px; color: var(--gold); }
  .animal .price svg { width: 14px; height: 14px; }
  .animal.cant .price { color: var(--dim); }
  .animal.nope { animation: nope 0.35s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* In-game HUD. */
  #hud {
    position: fixed; top: calc(var(--st) + 10px); left: 12px; right: 12px; height: 48px;
    display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  #hud { z-index: 10; }
  #hud.show { opacity: 1; }
  #hud .icoPlay, #hud.paused .icoPause { display: none; }
  #hud.paused .icoPlay { display: block; }
  #hud.paused #pauseBtn { background: var(--cyan); box-shadow: 0 0 20px rgba(62, 240, 255, 0.6); }
  #score { position: absolute; left: 50%; transform: translateX(-50%); font: 900 40px/1 var(--font); text-shadow: 0 0 20px rgba(62, 240, 255, 0.5); }
  #pauseBtn {
    pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>

<div id="hud">
  <div class="pill"><span class="coinIcon"></span><span id="hudCoins">0</span></div>
  <div id="score">0</div>
  <button id="pauseBtn" aria-label="Pause">
    <svg class="icoPause" width="18" height="20" viewBox="0 0 18 20"><rect x="1" width="6" height="20" rx="2" fill="#fff"/><rect x="11" width="6" height="20" rx="2" fill="#fff"/></svg>
    <svg class="icoPlay" width="20" height="22" viewBox="0 0 20 22"><path d="M3 2.5 Q3 0.5 5 1.6 L18.5 9.4 Q20 10.3 18.5 11.2 L5 20.4 Q3 21.5 3 19.5Z" fill="#0b0b1a"/></svg>
  </button>
</div>

<div class="screen" id="menu">
  <div class="topbar"><button class="iconBtn" id="settingsBtn" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><div class="pill"><span class="coinIcon"></span><span id="menuCoins">0</span></div></div>
  <div class="hero" id="hero"></div>
  <h1 class="title">DODGE</h1>
  <p class="sub" id="tagline"></p>
  <button class="btn pulse" id="playBtn">PLAY</button>
  <button class="btn ghost" id="animalsBtn">ANIMALS</button>
  <p class="sub" id="menuBest"></p>
  <div class="install" id="install">Play it like an app: tap <b>Share</b> &rarr; <b>Add to Home Screen</b>, keep <b>Open as Web App</b> on, then open it from the icon.</div>
  <div class="footer">Powered by Hamza Tamyachte</div>
</div>

<div class="screen dim" id="animals">
  <div class="topbar"><button class="btn ghost small" id="backBtn">&larr; Back</button><div class="pill"><span class="coinIcon"></span><span id="shopCoins">0</span></div></div>
  <h2 class="title" style="font-size:36px">ANIMALS</h2>
  <p class="sub">Collect coins to unlock friends.</p>
  <div class="grid" id="grid"></div>
</div>

<div class="screen dim" id="pause">
  <div class="card">
    <div class="label">PAUSED</div>
    <div class="big" id="pauseScore">0</div>
    <button class="playBig" id="resumeBtn" aria-label="Resume">
      <svg width="38" height="42" viewBox="0 0 20 22"><path d="M3 2.5 Q3 0.5 5 1.6 L18.5 9.4 Q20 10.3 18.5 11.2 L5 20.4 Q3 21.5 3 19.5Z" fill="#0b0b1a"/></svg>
    </button>
    <button class="btn ghost" id="restartBtn">RESTART</button>
    <button class="btn ghost" id="pauseSettingsBtn">SETTINGS</button>
    <button class="btn ghost" id="pauseHomeBtn">HOME</button>
  </div>
</div>

<div class="screen dim" id="settings">
  <div class="card">
    <div class="label">SETTINGS</div>
    <div class="setting"><span>Sound effects</span><button class="switch" id="soundSwitch" role="switch" aria-label="Sound effects"></button></div>
    <div class="setting col"><span>Control speed</span>
      <div class="seg" id="sensSeg"><button data-v="1">Slow</button><button data-v="1.3">Normal</button><button data-v="1.7">Fast</button></div>
    </div>
    <div class="setting"><span>Reset progress</span><button class="btn ghost small danger" id="resetBtn">Reset</button></div>
    <button class="btn" id="settingsDone">DONE</button>
    <div class="version">Dodge v12</div>
  </div>
</div>

<div class="screen dim" id="over">
  <div class="card">
    <div class="label">GAME OVER</div>
    <div class="big" id="overScore">0</div>
    <div class="row">
      <span class="sub" id="overBest"></span>
      <div class="pill"><span class="coinIcon"></span><span id="overCoins">+0</span></div>
    </div>
    <div class="badge" id="newBest">NEW BEST!</div>
    <div class="hint" id="unlockHint"></div>
    <button class="btn" id="retryBtn">RETRY</button>
    <button class="btn ghost" id="overHomeBtn">HOME</button>
  </div>
</div>

<script src="worlds.js"></script>
<script>
// ---------- Art (SVG) ----------
const svg = body => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>${body}</svg>`;
const eyes = (y, dx = 13, r = 5.5) =>
  `<circle cx='${50 - dx}' cy='${y}' r='${r}' fill='#1b1b2f'/><circle cx='${50 + dx}' cy='${y}' r='${r}' fill='#1b1b2f'/>` +
  `<circle cx='${50 - dx + 1.8}' cy='${y - 1.8}' r='${r * 0.38}' fill='#fff'/><circle cx='${50 + dx + 1.8}' cy='${y - 1.8}' r='${r * 0.38}' fill='#fff'/>`;
const blush = y =>
  `<ellipse cx='25' cy='${y}' rx='6.5' ry='3.8' fill='#ff7aa2' opacity='.55'/><ellipse cx='75' cy='${y}' rx='6.5' ry='3.8' fill='#ff7aa2' opacity='.55'/>`;
const smile = y => `<path d='M50 ${y} Q45 ${y + 6} 41 ${y + 3} M50 ${y} Q55 ${y + 6} 59 ${y + 3}' stroke='#1b1b2f' stroke-width='2.2' fill='none' stroke-linecap='round'/>`;

const ANIMALS = [
  { id: 'fox', name: 'Fox', price: 0, color: '#f47b20', svg: svg(
    `<path d='M12 10 L42 30 L20 50Z' fill='#f47b20'/><path d='M88 10 L58 30 L80 50Z' fill='#f47b20'/>` +
    `<path d='M18 19 L33 30 L23 41Z' fill='#5a2a10'/><path d='M82 19 L67 30 L77 41Z' fill='#5a2a10'/>` +
    `<ellipse cx='50' cy='56' rx='37' ry='33' fill='#f47b20'/>` +
    `<path d='M13 56 Q32 58 50 80 Q68 58 87 56 Q86 86 50 90 Q14 86 13 56Z' fill='#fff4e6'/>` +
    eyes(50) + `<ellipse cx='50' cy='71' rx='6' ry='4.5' fill='#1b1b2f'/>` + smile(75)) },
  { id: 'cat', name: 'Cat', price: 25, color: '#9aa3c7', svg: svg(
    `<path d='M16 12 L40 32 L18 46Z' fill='#9aa3c7'/><path d='M84 12 L60 32 L82 46Z' fill='#9aa3c7'/>` +
    `<path d='M21 21 L33 32 L22 40Z' fill='#ffb3c8'/><path d='M79 21 L67 32 L78 40Z' fill='#ffb3c8'/>` +
    `<ellipse cx='50' cy='57' rx='38' ry='33' fill='#9aa3c7'/>` +
    `<path d='M43 27 L45 38 M50 26 L50 38 M57 27 L55 38' stroke='#6f779c' stroke-width='3.5' stroke-linecap='round'/>` +
    eyes(54) + blush(66) + `<path d='M46 63 L54 63 L50 68Z' fill='#ff7aa2'/>` + smile(68) +
    `<path d='M6 60 L27 63 M6 70 L27 68 M94 60 L73 63 M94 70 L73 68' stroke='#e8ebff' stroke-width='1.8' stroke-linecap='round'/>`) },
  { id: 'frog', name: 'Frog', price: 50, color: '#5fd35f', svg: svg(
    `<circle cx='30' cy='30' r='16' fill='#5fd35f'/><circle cx='70' cy='30' r='16' fill='#5fd35f'/>` +
    `<ellipse cx='50' cy='60' rx='41' ry='30' fill='#5fd35f'/>` +
    `<circle cx='30' cy='29' r='10' fill='#fff'/><circle cx='70' cy='29' r='10' fill='#fff'/>` +
    `<circle cx='32' cy='30' r='5.5' fill='#1b1b2f'/><circle cx='72' cy='30' r='5.5' fill='#1b1b2f'/>` +
    `<circle cx='33.5' cy='28' r='2' fill='#fff'/><circle cx='73.5' cy='28' r='2' fill='#fff'/>` +
    `<circle cx='45' cy='52' r='1.8' fill='#2f7a2f'/><circle cx='55' cy='52' r='1.8' fill='#2f7a2f'/>` +
    blush(62) + `<path d='M28 63 Q50 82 72 63' stroke='#2f7a2f' stroke-width='4' fill='none' stroke-linecap='round'/>`) },
  { id: 'panda', name: 'Panda', price: 100, color: '#fbfbff', svg: svg(
    `<circle cx='22' cy='24' r='14' fill='#1b1b2f'/><circle cx='78' cy='24' r='14' fill='#1b1b2f'/>` +
    `<ellipse cx='50' cy='56' rx='38' ry='34' fill='#fbfbff'/>` +
    `<ellipse cx='35' cy='52' rx='10' ry='12' fill='#1b1b2f' transform='rotate(-25 35 52)'/><ellipse cx='65' cy='52' rx='10' ry='12' fill='#1b1b2f' transform='rotate(25 65 52)'/>` +
    `<circle cx='36' cy='51' r='4.5' fill='#fff'/><circle cx='64' cy='51' r='4.5' fill='#fff'/>` +
    `<circle cx='37' cy='51' r='2.6' fill='#1b1b2f'/><circle cx='65' cy='51' r='2.6' fill='#1b1b2f'/>` +
    blush(67) + `<ellipse cx='50' cy='67' rx='6' ry='4' fill='#1b1b2f'/>` + smile(71)) },
  { id: 'bunny', name: 'Bunny', price: 150, color: '#f4f0ff', svg: svg(
    `<ellipse cx='36' cy='24' rx='9' ry='22' fill='#f4f0ff'/><ellipse cx='64' cy='24' rx='9' ry='22' fill='#f4f0ff'/>` +
    `<ellipse cx='36' cy='26' rx='4.5' ry='15' fill='#ffb3c8'/><ellipse cx='64' cy='26' rx='4.5' ry='15' fill='#ffb3c8'/>` +
    `<ellipse cx='50' cy='64' rx='35' ry='29' fill='#f4f0ff'/>` +
    eyes(60, 12, 5) + blush(71) + `<ellipse cx='50' cy='70' rx='4' ry='3' fill='#ff7aa2'/>` + smile(73) +
    `<rect x='47' y='76' width='6' height='5' rx='1' fill='#fff' stroke='#d8d0ee'/>`) },
  { id: 'penguin', name: 'Penguin', price: 250, color: '#3b4f80', svg: svg(
    `<path d='M46 18 Q50 7 54 18' stroke='#23304f' stroke-width='4' fill='none' stroke-linecap='round'/>` +
    `<circle cx='50' cy='54' r='38' fill='#23304f'/>` +
    `<path d='M50 34 C38 22 16 30 20 54 C22 76 38 88 50 88 C62 88 78 76 80 54 C84 30 62 22 50 34Z' fill='#f7f7ff'/>` +
    eyes(52, 14) + blush(64) + `<path d='M42 61 L58 61 L50 71Z' fill='#ff9a3c'/>`) },
];

const COIN_SVG = svg(
  `<circle cx='50' cy='50' r='46' fill='#d99a00'/><circle cx='50' cy='50' r='38' fill='#ffd23f'/>` +
  `<circle cx='50' cy='50' r='33' fill='none' stroke='#fff3b0' stroke-width='3' stroke-dasharray='3 7' opacity='.8'/>` +
  `<path d='M50 27 L56 43 L73 43 L59 53 L64 70 L50 60 L36 70 L41 53 L27 43 L44 43Z' fill='#fff3b0'/>`);

// Rasterize each SVG once; drawing a cached bitmap is far cheaper than drawing SVG every frame.
function sprite(svgStr, px = 192) {
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const s = { canvas: c, ready: false };
  const img = new Image();
  img.onload = () => { c.getContext('2d').drawImage(img, 0, 0, px, px); s.ready = true; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  return s;
}
ANIMALS.forEach(a => a.sprite = sprite(a.svg));

// Enemy sprites per world: the world's humans plus its thrown object.
for (const w of Object.values(WORLDS)) {
  w.kinds = [
    ...w.humans.map(id => ({ human: true, spin: false, color: w.accent, hit: 0.34, min: 52, max: 74,
      sprite: HUMANS[id].sprite || (HUMANS[id].sprite = sprite(HUMANS[id].svg, 176)) })),
    { human: false, spin: w.object !== 'waterDrop', color: w.objectColor, hit: 0.38, min: 28, max: 50, sprite: sprite(OBJECTS[w.object], 128) },
  ];
}

// Rare coins: bigger, own color, value printed on the face.
const coinSvg = (rim, face, shine, value, ink) => svg(
  `<circle cx='50' cy='50' r='46' fill='${rim}'/><circle cx='50' cy='50' r='38' fill='${face}'/>` +
  `<circle cx='50' cy='50' r='33' fill='none' stroke='${shine}' stroke-width='3' stroke-dasharray='3 7' opacity='.8'/>` +
  `<text x='50' y='52' text-anchor='middle' dominant-baseline='middle' font-family='Arial Black, Arial, Helvetica, sans-serif' ` +
  `font-weight='900' font-size='${value >= 10 ? 36 : 46}' fill='${ink}'>${value}</text>`);
const COIN_TYPES = [
  { value: 1, r: 15, color: '#ffd23f', svg: COIN_SVG },
  { value: 2, r: 18, color: '#3ef0ff', svg: coinSvg('#1a8fa8', '#3ef0ff', '#d9fdff', 2, '#0b3a48') },
  { value: 5, r: 20, color: '#b56cff', svg: coinSvg('#6a2fb0', '#b56cff', '#f0dcff', 5, '#ffffff') },
  { value: 10, r: 23, color: '#ff5c8a', svg: coinSvg('#b0204e', '#ff5c8a', '#ffe0ea', 10, '#ffffff') },
];
COIN_TYPES.forEach(t => t.sprite = sprite(t.svg, 112));
// Chance per coin drop, rarest first.
const RARE = [{ type: COIN_TYPES[3], chance: 0.01 }, { type: COIN_TYPES[2], chance: 0.03 }, { type: COIN_TYPES[1], chance: 0.08 }];
function rollCoinType() {
  let roll = Math.random();
  for (const r of RARE) { if (roll < r.chance) return r.type; roll -= r.chance; }
  return COIN_TYPES[0];
}

// ---------- Storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('dodge-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('dodge-' + k, JSON.stringify(v)); } catch {} },
};
let best = Number(store.get('best', 0)) || 0;
let bank = Number(store.get('coins', 0)) || 0;
let owned = store.get('owned', ['fox']);
let selected = store.get('selected', 'fox');
if (!ANIMALS.some(a => a.id === selected)) selected = 'fox';
const animal = () => ANIMALS.find(a => a.id === selected);
let world = WORLDS[selected];
const hexA = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;

// ---------- Sound (synthesized with Web Audio, no files) ----------
const sfx = (() => {
  let ac = null, master = null, noiseBuf = null;
  let muted = !!store.get('muted', false);

  // iOS only allows audio to start inside a user gesture, so this runs on every touch.
  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.6;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state !== 'running') ac.resume();
  }

  function tone(freq, dur, { type = 'sine', vol = 0.2, at = 0, to = null } = {}) {
    const t = ac.currentTime + at;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function noise(dur, { vol = 0.3, from = 4000, to = 200, at = 0, type = 'lowpass', q = 1 } = {}) {
    const t = ac.currentTime + at;
    const src = ac.createBufferSource();
    const f = ac.createBiquadFilter();
    const g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = type;
    f.Q.value = q;
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  const play = fn => { if (!muted && ac && ac.state === 'running') fn(); };
  const notes = (list, type, vol, step) => list.forEach((f, i) => tone(f, step * 2.2, { type, vol, at: i * step }));

  return {
    unlock,
    get muted() { return muted; },
    toggle() { muted = !muted; store.set('muted', muted); },
    tap: () => play(() => tone(700, 0.05, { type: 'triangle', vol: 0.12 })),
    start: () => play(() => tone(300, 0.25, { type: 'triangle', vol: 0.18, to: 900 })),
    // Each coin in a quick streak goes a semitone higher.
    coin: streak => play(() => {
      const f = 988 * Math.pow(2, Math.min(streak, 12) / 12);
      tone(f, 0.07, { type: 'square', vol: 0.06 });
      tone(f * 1.335, 0.2, { type: 'square', vol: 0.06, at: 0.06 });
    }),
    // Rare coin: bright sparkle run, longer for bigger values.
    rareCoin: value => play(() => {
      const run = value >= 10 ? [1047, 1319, 1568, 2093, 2637, 3136] : value >= 5 ? [1047, 1319, 1568, 2093] : [1319, 1760, 2093];
      notes(run, 'triangle', 0.13, 0.05);
      tone(run[run.length - 1], 0.4, { type: 'sine', vol: 0.1, at: run.length * 0.05 });
    }),
    whoosh: () => play(() => noise(0.25, { vol: 0.18, from: 600, to: 2500, type: 'bandpass', q: 2 })),
    boom: () => play(() => {
      noise(0.7, { vol: 0.5, from: 3000, to: 80 });
      tone(140, 0.5, { vol: 0.45, to: 35 });
    }),
    gameOver: () => play(() => notes([392, 330, 262], 'triangle', 0.14, 0.14)),
    newBest: () => play(() => notes([523, 659, 784, 1047, 1319], 'square', 0.07, 0.09)),
    buy: () => play(() => notes([523, 659, 784, 1047], 'triangle', 0.16, 0.07)),
    nope: () => play(() => { tone(180, 0.12, { type: 'square', vol: 0.07 }); tone(140, 0.16, { type: 'square', vol: 0.07, at: 0.12 }); }),
    pause: () => play(() => tone(520, 0.12, { type: 'triangle', vol: 0.15, to: 330 })),
    beep: go => play(() => tone(go ? 880 : 440, go ? 0.3 : 0.12, { type: 'square', vol: 0.07 })),
  };
})();
['touchstart', 'touchend', 'mousedown', 'keydown'].forEach(ev =>
  document.addEventListener(ev, sfx.unlock, { capture: true, passive: true }));

// ---------- Canvas setup ----------
const $ = id => document.getElementById(id);
const canvas = $('c');
const ctx = canvas.getContext('2d');
const FONT = '-apple-system, "SF Pro Rounded", system-ui, sans-serif';
let W, H, DPR, safeBottom = 0, bg;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  safeBottom = parseFloat(getComputedStyle($('safe')).paddingBottom) || 0;
  bg = makeBackground();
}

function makeBackground() {
  const c = document.createElement('canvas');
  c.width = W * DPR;
  c.height = H * DPR;
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  SCENES[world.scene](g, W, H);
  return c;
}

// Pre-rendered glow sprites: much cheaper than ctx.shadowBlur on iPhone.
const glowCache = {};
function glow(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, color + 'aa');
  grad.addColorStop(0.35, color + '44');
  grad.addColorStop(1, color + '00');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return (glowCache[color] = c);
}
function drawGlow(x, y, color, rx, ry = rx, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(glow(color), x - rx, y - ry, rx * 2, ry * 2);
  ctx.globalAlpha = 1;
}
function drawSprite(s, x, y, size, rot = 0, sx = 1, sy = 1) {
  if (!s.ready) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(sx, sy);
  ctx.drawImage(s.canvas, -size / 2, -size / 2, size, size);
  ctx.restore();
}

// ---------- Game state ----------
// Ambient effect of the current world (fireflies, rain, snow...). Positions are 0..1 of the screen.
let ambient = [];
function makeAmbient() {
  const n = { fireflies: 26, rain: 80, pollen: 40, leaves: 16, petals: 18, snow: 90 }[world.ambient] || 40;
  ambient = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), s: Math.random(), ph: Math.random() * 6.28 }));
}
function updateAmbient(dt, speed) {
  if (speed === 0) return;
  const k = world.ambient;
  for (const p of ambient) {
    if (k === 'fireflies') {
      p.x += Math.cos(time * 0.7 + p.ph) * 0.03 * dt;
      p.y += (Math.sin(time * 0.9 + p.ph * 1.3) * 0.03 + 0.01 * speed) * dt;
    } else if (k === 'rain') {
      p.y += (1.1 + p.s * 0.6) * (0.5 + speed * 0.5) * dt;
      p.x -= 0.12 * dt;
    } else if (k === 'pollen') {
      p.y += 0.015 * speed * dt;
      p.x += Math.sin(time + p.ph) * 0.02 * dt;
    } else if (k === 'snow') {
      p.y += (0.04 + p.s * 0.06) * speed * dt;
      p.x += Math.sin(time * 0.8 + p.ph) * 0.02 * dt;
    } else {
      p.y += (0.06 + p.s * 0.05) * speed * dt;
      p.x += Math.sin(time * 1.2 + p.ph) * 0.05 * dt;
    }
    if (p.y > 1.03) { p.y -= 1.06; p.x = Math.random(); }
    if (p.x < -0.03) p.x += 1.06; else if (p.x > 1.03) p.x -= 1.06;
  }
}
function drawAmbient() {
  const k = world.ambient;
  if (k === 'rain') {
    ctx.strokeStyle = 'rgba(170,205,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const p of ambient) { const x = p.x * W, y = p.y * H; ctx.moveTo(x, y); ctx.lineTo(x + 3, y - 14 - p.s * 8); }
    ctx.stroke();
    return;
  }
  for (const p of ambient) {
    const x = p.x * W, y = p.y * H;
    if (k === 'fireflies') {
      const a = 0.3 + 0.7 * Math.max(0, Math.sin(time * 2.5 + p.ph));
      drawGlow(x, y, '#d4ff6b', 9, 9, a);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#f4ffd0';
      ctx.fillRect(x - 1, y - 1, 2, 2);
    } else if (k === 'pollen' || k === 'snow') {
      ctx.globalAlpha = 0.45 + p.s * 0.4;
      ctx.fillStyle = k === 'snow' ? '#ffffff' : '#ffd9a0';
      ctx.beginPath();
      ctx.arc(x, y, k === 'snow' ? 1 + p.s * 2.2 : 1 + p.s * 1.5, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(time * 1.5 + p.ph);
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = k === 'leaves' ? '#5fae6b' : '#ffb3c8';
      ctx.beginPath();
      ctx.ellipse(0, 0, 6 + p.s * 3, 2.5 + p.s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function applyWorld() {
  world = WORLDS[selected];
  meteors = [];
  makeAmbient();
  if (W) bg = makeBackground();
}

const player = { x: 0, y: 0, size: 60, targetX: 0, vx: 0, trail: [] };
let meteors = [], coins = [], particles = [], floaters = [];
let state = 'menu', score = 0, runCoins = 0, newBest = false;
let spawnTimer = 0, coinTimer = 0, elapsed = 0, last = 0, time = 0;
let shake = 0, flash = 0, countdown = 0, overTimer = 0, overShown = false;
let dragX = null;
let sensitivity = Number(store.get('sens', 1.3)) || 1.3;
let coinStreak = 0, lastCoinAt = -9, lastBeep = 0;

function playerY() { return H - 120 - safeBottom; }

function newGame() {
  player.x = player.targetX = W / 2;
  player.y = playerY();
  player.trail = [];
  meteors = []; coins = []; particles = []; floaters = [];
  score = 0; runCoins = 0; newBest = false;
  spawnTimer = 0.6; coinTimer = 1; elapsed = 0;
  state = 'play';
  coinStreak = 0;
  sfx.start();
  show(null);
  updateHud(true);
}

// ---------- Input: relative drag, finger never covers the animal ----------
function fingerX(e) { const t = e.touches ? e.touches[0] : e; return t ? t.clientX : null; }
function dragStart(e) { if (state === 'play') dragX = fingerX(e); }
function dragMove(e) {
  if (state !== 'play' || dragX === null) return;
  const x = fingerX(e);
  if (x === null) return;
  player.targetX = Math.max(player.size / 2, Math.min(W - player.size / 2, player.targetX + (x - dragX) * sensitivity));
  dragX = x;
}
canvas.addEventListener('touchstart', e => { e.preventDefault(); dragStart(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); dragMove(e); }, { passive: false });
canvas.addEventListener('touchend', () => { dragX = null; });
canvas.addEventListener('mousedown', dragStart);
canvas.addEventListener('mousemove', e => { if (e.buttons) dragMove(e); });
canvas.addEventListener('mouseup', () => { dragX = null; });

// ---------- Spawning ----------
const CLEARANCE = 12;

// Meteors and coins fall straight down at constant speeds, so we can tell at spawn time
// whether a pair would ever touch on screen.
function wouldCross(m, c) {
  const reach = m.size / 2 + c.type.r + CLEARANCE;
  if (Math.abs(m.x - c.x) >= reach) return false;
  const gap = c.y - m.y;          // > 0: coin is below the meteor
  if (Math.abs(gap) < reach) return true;
  const closing = m.v - c.v;      // > 0: meteor is catching up from above
  if ((gap > 0 && closing <= 0) || (gap < 0 && closing >= 0)) return false;
  const t = (Math.abs(gap) - reach) / Math.abs(closing);
  return c.y + c.v * t < H + 60;
}

function spawnMeteor(slow = 1) {
  // 60% humans, 40% the world's thrown object.
  const kinds = world.kinds;
  const kind = Math.random() < 0.6 ? kinds[Math.floor(Math.random() * (kinds.length - 1))] : kinds[kinds.length - 1];
  const size = kind.min + Math.random() * (kind.max - kind.min);
  const m = {
    x: 0, y: -size, size, kind,
    v: (180 + elapsed * 12 + Math.random() * 120) * slow,
    rot: kind.spin ? Math.random() * Math.PI : 0,
    spin: kind.spin ? (Math.random() - 0.5) * 3 : 0,
    flip: Math.random() < 0.5 ? -1 : 1,
    ph: Math.random() * 6.28,
  };
  for (let i = 0; i < 12; i++) {
    m.x = size / 2 + Math.random() * (W - size);
    if (!coins.some(c => wouldCross(m, c))) { meteors.push(m); return true; }
  }
  return false;
}

function spawnCoins() {
  const type = rollCoinType();
  // Normal coins sometimes come as a vertical line, worth steering for. Rare coins come alone.
  const n = type.value === 1 && Math.random() < 0.35 ? 3 + Math.floor(Math.random() * 3) : 1;
  const v = 170 + elapsed * 6;
  for (let i = 0; i < 12; i++) {
    const x = 30 + Math.random() * (W - 60);
    const line = Array.from({ length: n }, (_, k) => ({ x, y: -30 - k * 46, v, type, phase: Math.random() * 6 }));
    if (!line.some(c => meteors.some(m => wouldCross(m, c)))) { coins.push(...line); return true; }
  }
  return false;
}

function burst(x, y, color, count, power) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = power * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.8 + Math.random() * 1.2, size: 2 + Math.random() * 4, color });
  }
}

// ---------- Game flow ----------
function pause() {
  if (state !== 'play' && state !== 'countdown') return;
  state = 'paused';
  dragX = null;
  sfx.pause();
  $('pauseScore').textContent = Math.floor(score);
  show('pause');
}
function resume() {
  state = 'countdown';
  countdown = 3;
  lastBeep = 4;
  show(null);
}
function die() {
  state = 'over';
  overTimer = 0;
  overShown = false;
  shake = 18;
  flash = 1;
  sfx.boom();
  burst(player.x, player.y, animal().color, 50, 420);
  burst(player.x, player.y, '#ffffff', 20, 250);
  if (Math.floor(score) > best) {
    best = Math.floor(score);
    newBest = true;
    store.set('best', best);
  }
}
function showGameOver() {
  $('overScore').textContent = Math.floor(score);
  $('overBest').textContent = `Best ${best}`;
  $('overCoins').textContent = `+${runCoins}`;
  $('newBest').style.display = newBest ? '' : 'none';
  const next = ANIMALS.find(a => !owned.includes(a.id) && a.price <= bank);
  $('unlockHint').textContent = next ? `You can unlock the ${next.name}!` : '';
  newBest ? sfx.newBest() : sfx.gameOver();
  show('over');
}
function goHome() {
  state = 'menu';
  meteors = []; coins = []; particles = []; floaters = [];
  refreshMenu();
  show('menu');
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 60);
  flash = Math.max(0, flash - dt * 3);

  const speed = state === 'play' ? 1 + elapsed * 0.06 : state === 'paused' ? 0 : 0.5;
  updateAmbient(dt, speed);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 50 * dt; f.life -= dt * 1.5; }
  floaters = floaters.filter(f => f.life > 0);

  if (state === 'menu' || state === 'animals') {
    // Slow meteors drifting behind the menus.
    if (Math.random() < dt * 1.5) spawnMeteor(0.35);
    for (const m of meteors) { m.y += m.v * dt; m.rot += m.spin * dt; }
    meteors = meteors.filter(m => m.y < H + 100);
    return;
  }
  if (state === 'over') {
    overTimer += dt;
    for (const m of meteors) { m.y += m.v * dt * 0.25; m.rot += m.spin * dt * 0.25; }
    if (overTimer > 0.7 && !overShown) { overShown = true; showGameOver(); }
    return;
  }
  if (state === 'countdown') {
    countdown -= dt;
    const n = Math.ceil(countdown);
    if (n < lastBeep && n > 0) { lastBeep = n; sfx.beep(false); }
    if (countdown <= 0) { state = 'play'; sfx.beep(true); }
    return;
  }
  if (state !== 'play') return;

  elapsed += dt;
  score += dt * 10;

  const prevX = player.x;
  player.x += (player.targetX - player.x) * Math.min(1, dt * 18);
  player.y = playerY();
  player.vx = (player.x - prevX) / Math.max(dt, 0.001);
  player.trail.unshift({ x: player.x, y: player.y });
  if (player.trail.length > 7) player.trail.pop();

  spawnTimer -= dt;
  // No clear spot this frame: retry shortly instead of forcing an overlap.
  if (spawnTimer <= 0) spawnTimer = spawnMeteor() ? Math.max(0.2, 0.85 - elapsed * 0.02) : 0.05;
  coinTimer -= dt;
  if (coinTimer <= 0) coinTimer = spawnCoins() ? 1.2 + Math.random() * 1.2 : 0.2;

  for (const c of coins) {
    c.y += c.v * dt;
    // Safety net: a coin that ends up near a meteor slides out of its way.
    for (const m of meteors) {
      const reach = m.size / 2 + c.type.r + 6;
      const dx = c.x - m.x;
      if (Math.abs(dx) < reach && Math.abs(c.y - m.y) < reach) {
        const dir = dx !== 0 ? Math.sign(dx) : (c.x < W / 2 ? 1 : -1);
        c.x = Math.max(c.type.r, Math.min(W - c.type.r, c.x + dir * 260 * dt));
      }
    }
    if (Math.hypot(player.x - c.x, player.y - c.y) < player.size * 0.5 + c.type.r - 1) {
      c.taken = true;
      coinStreak = time - lastCoinAt < 0.7 ? coinStreak + 1 : 0;
      lastCoinAt = time;
      const val = c.type.value;
      val > 1 ? sfx.rareCoin(val) : sfx.coin(coinStreak);
      runCoins += val;
      bank += val;
      store.set('coins', bank);
      score += 5 * val;
      burst(c.x, c.y, c.type.color, val > 1 ? 30 + val * 3 : 12, val > 1 ? 260 : 160);
      if (val > 1) burst(c.x, c.y, '#ffffff', 10, 200);
      floaters.push({ x: c.x, y: c.y - 10, text: val > 1 ? `x${val}  +${val}` : '+1', life: 1, color: c.type.color, size: val > 1 ? 26 : 20 });
    }
  }
  coins = coins.filter(c => !c.taken && c.y < H + 40);

  // Circle hitboxes, slightly smaller than the art so near misses feel fair.
  const pr = player.size * 0.36;
  for (const m of meteors) {
    m.y += m.v * dt;
    m.rot += m.spin * dt;
    const dist = Math.hypot(player.x - m.x, player.y - m.y);
    if (dist < pr + m.size * m.kind.hit) { die(); break; }
    if (!m.near && dist < pr + m.size * m.kind.hit + 24) { m.near = true; sfx.whoosh(); }
  }
  meteors = meteors.filter(m => m.y < H + 100);
  updateHud();
}

// ---------- Draw ----------
function text(str, x, y, size, color, weight = 900) {
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}

function drawMeteor(m) {
  const k = m.kind;
  if (k.human) {
    // Humans sway instead of spinning, and face either way.
    drawGlow(m.x, m.y, k.color, m.size * 0.9, m.size * 0.9, 0.3);
    drawSprite(k.sprite, m.x, m.y, m.size, Math.sin(time * 3 + m.ph) * 0.18, m.flip, 1);
  } else {
    drawGlow(m.x, m.y - m.size * 0.7, k.color, m.size * 0.3, m.size * 0.8, 0.3);
    drawGlow(m.x, m.y, k.color, m.size * 0.9, m.size * 0.9, 0.35);
    drawSprite(k.sprite, m.x, m.y, m.size, m.rot);
  }
}

function drawCoin(c) {
  const t = c.type, d = t.r * 2;
  if (t.value > 1) {
    // Rare coins pulse so they stand out; x10 pulses the most.
    const pulse = 1 + Math.sin(time * 6 + c.phase) * 0.15 * Math.min(t.value, 5) / 5;
    drawGlow(c.x, c.y, t.color, d * 1.6 * pulse, d * 1.6 * pulse, 0.8);
  } else {
    drawGlow(c.x, c.y, t.color, d, d, 0.5);
  }
  // Fake 3D spin by squashing horizontally; rare coins spin slower so the number is readable.
  const sx = Math.max(0.15, Math.abs(Math.cos(time * (t.value > 1 ? 2 : 4) + c.phase)));
  drawSprite(t.sprite, c.x, c.y, d, 0, sx, 1);
}

function drawPlayer() {
  const a = animal();
  const s = player.size;
  ctx.globalCompositeOperation = 'lighter';
  player.trail.forEach((t, i) => {
    const k = 1 - i / player.trail.length;
    drawGlow(t.x, t.y + i * 4, world.accent, s * 0.5 * k, s * 0.5 * k, 0.35 * k);
  });
  ctx.globalCompositeOperation = 'source-over';
  drawGlow(player.x, player.y, world.accent, s * 1.5, s * 1.5, 0.7 + Math.sin(time * 6) * 0.1);
  // Tilt with movement, small bounce so it feels alive.
  const tilt = Math.max(-0.35, Math.min(0.35, player.vx / 1800));
  const bounce = 1 + Math.sin(time * 10) * 0.03;
  drawSprite(a.sprite, player.x, player.y, s, tilt, 1 / bounce, bounce);
}

function draw() {
  ctx.drawImage(bg, 0, 0, W, H);
  drawAmbient();

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  const inMenu = state === 'menu' || state === 'animals';
  if (!inMenu) {
    const floorY = playerY() + 42;
    const floor = ctx.createLinearGradient(0, 0, W, 0);
    floor.addColorStop(0, hexA(world.accent, 0));
    floor.addColorStop(0.5, hexA(world.accent, 0.4));
    floor.addColorStop(1, hexA(world.accent, 0));
    ctx.fillStyle = floor;
    ctx.fillRect(0, floorY, W, 2);
  }

  if (inMenu) ctx.globalAlpha = 0.45;
  coins.forEach(drawCoin);
  meteors.forEach(drawMeteor);
  ctx.globalAlpha = 1;
  if (state === 'play' || state === 'paused' || state === 'countdown') drawPlayer();

  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  for (const f of floaters) {
    ctx.globalAlpha = Math.max(0, f.life);
    text(f.text, f.x, f.y, f.size || 20, f.color || '#ffd23f');
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'countdown') {
    const n = Math.ceil(countdown);
    const k = countdown - Math.floor(countdown);
    ctx.globalAlpha = Math.min(1, k * 2 + 0.2);
    text(n, W / 2, H * 0.42, 90 + (1 - k) * 30, '#f4f6ff');
    ctx.globalAlpha = 1;
  }
}

function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- UI ----------
document.querySelectorAll('.coinIcon').forEach(el => el.innerHTML = COIN_SVG);

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('show', s.id === id));
  $('hud').classList.toggle('show', ['play', 'paused', 'countdown'].includes(state));
  $('hud').classList.toggle('paused', state === 'paused');
}

let hudScore = -1, hudCoins = -1;
function updateHud(force) {
  const s = Math.floor(score);
  if (force || s !== hudScore) { hudScore = s; $('score').textContent = s; }
  if (force || bank !== hudCoins) { hudCoins = bank; $('hudCoins').textContent = bank; }
}

function refreshMenu() {
  $('hero').innerHTML = animal().svg;
  $('tagline').innerHTML = `${world.name}: dodge ${world.enemies}.<br>Drag anywhere to move, grab coins.`;
  $('menuCoins').textContent = bank;
  $('shopCoins').textContent = bank;
  $('menuBest').textContent = best ? `Best ${best}` : '';
}

function renderGrid() {
  $('grid').innerHTML = '';
  for (const a of ANIMALS) {
    const has = owned.includes(a.id);
    const el = document.createElement('button');
    el.className = 'animal' + (has ? '' : ' locked') + (a.id === selected ? ' selected' : '') + (!has && a.price > bank ? ' cant' : '');
    el.innerHTML = a.svg + `<span>${a.name}</span><span class="world">${WORLDS[a.id].name}</span>` +
      (has ? `<span style="color:var(--dim)">${a.id === selected ? 'Selected' : 'Owned'}</span>`
           : `<span class="price">${COIN_SVG}${a.price}</span>`);
    el.addEventListener('click', () => {
      if (!has) {
        if (a.price > bank) { sfx.nope(); el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope'); return; }
        sfx.buy();
        bank -= a.price;
        owned.push(a.id);
        store.set('coins', bank);
        store.set('owned', owned);
      } else {
        sfx.tap();
      }
      selected = a.id;
      store.set('selected', selected);
      applyWorld();
      refreshMenu();
      renderGrid();
    });
    $('grid').appendChild(el);
  }
}

// ---------- Settings ----------
let settingsFrom = 'menu', resetArmed = null;
function renderSettings() {
  $('soundSwitch').classList.toggle('on', !sfx.muted);
  $('soundSwitch').setAttribute('aria-checked', String(!sfx.muted));
  $('sensSeg').querySelectorAll('button').forEach(b => b.classList.toggle('on', Number(b.dataset.v) === sensitivity));
}
function openSettings() {
  settingsFrom = state === 'paused' ? 'pause' : 'menu';
  renderSettings();
  show('settings');
}
function closeSettings() {
  disarmReset();
  if (settingsFrom === 'pause') { show('pause'); } else { refreshMenu(); show('menu'); }
}
function disarmReset() {
  clearTimeout(resetArmed);
  resetArmed = null;
  $('resetBtn').classList.remove('armed');
  $('resetBtn').textContent = 'Reset';
}
$('soundSwitch').onclick = () => { sfx.toggle(); renderSettings(); sfx.tap(); };
$('sensSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  sensitivity = Number(b.dataset.v);
  store.set('sens', sensitivity);
  renderSettings();
  sfx.tap();
});
// Two taps to reset, so a stray tap never wipes coins and animals.
$('resetBtn').onclick = () => {
  if (!resetArmed) {
    sfx.nope();
    $('resetBtn').classList.add('armed');
    $('resetBtn').textContent = 'Tap again';
    resetArmed = setTimeout(disarmReset, 3000);
    return;
  }
  best = 0; bank = 0; owned = ['fox']; selected = 'fox';
  applyWorld();
  store.set('best', best); store.set('coins', bank); store.set('owned', owned); store.set('selected', selected);
  disarmReset();
  refreshMenu();
  sfx.pause();
};
$('settingsBtn').onclick = openSettings;
$('pauseSettingsBtn').onclick = openSettings;
$('settingsDone').onclick = closeSettings;

// Show the install tip only when running in the browser, not from the Home Screen icon.
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
const touchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
$('install').classList.toggle('show', !standalone && touchDevice);
$('menu').classList.toggle('hasTip', !standalone && touchDevice);
// Soft click on menu buttons (not the ones that already have their own sound).
['animalsBtn', 'backBtn', 'restartBtn', 'pauseHomeBtn', 'overHomeBtn', 'resumeBtn', 'settingsBtn', 'pauseSettingsBtn', 'settingsDone'].forEach(id => $(id).addEventListener('click', sfx.tap));

$('playBtn').onclick = newGame;
$('animalsBtn').onclick = () => { state = 'animals'; renderGrid(); refreshMenu(); show('animals'); };
$('backBtn').onclick = () => { state = 'menu'; show('menu'); };
$('pauseBtn').onclick = () => state === 'paused' ? resume() : pause();
$('resumeBtn').onclick = resume;
$('restartBtn').onclick = newGame;
$('pauseHomeBtn').onclick = goHome;
$('retryBtn').onclick = newGame;
$('overHomeBtn').onclick = goHome;

// Auto-pause when the app goes to the background.
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('blur', pause);

window.addEventListener('resize', resize);
applyWorld();
resize();
refreshMenu();
show('menu');
requestAnimationFrame(loop);

// Offline support. Only registers over https or localhost.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
