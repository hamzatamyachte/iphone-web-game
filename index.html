<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dodge">
<meta name="theme-color" content="#0b0b1a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Dodge</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b0b1a; overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100dvh; }
  /* Invisible probe so JS can read the notch / home-indicator insets. */
  #safe {
    position: fixed; visibility: hidden; pointer-events: none;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const FONT = '-apple-system, "SF Pro Rounded", system-ui, sans-serif';
const COLORS = {
  player: '#3ef0ff',
  blocks: ['#ff5c8a', '#ff9a3c', '#ffd23f', '#b56cff'],
  text: '#f4f6ff',
  dim: '#8a8fb8',
};
let W, H, DPR, safeTop = 0, safeBottom = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const s = getComputedStyle(document.getElementById('safe'));
  safeTop = parseFloat(s.paddingTop) || 0;
  safeBottom = parseFloat(s.paddingBottom) || 0;
  bg = makeBackground();
}

// Pre-rendered glow sprites: much cheaper than ctx.shadowBlur on iPhone.
const glowCache = {};
function glow(color) {
  if (glowCache[color]) return glowCache[color];
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, color + 'aa');
  grad.addColorStop(0.35, color + '44');
  grad.addColorStop(1, color + '00');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return (glowCache[color] = c);
}

let bg;
function makeBackground() {
  const c = document.createElement('canvas');
  c.width = W * DPR;
  c.height = H * DPR;
  const g = c.getContext('2d');
  g.scale(DPR, DPR);
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0b0b1a');
  grad.addColorStop(0.6, '#161234');
  grad.addColorStop(1, '#2a1245');
  g.fillStyle = grad;
  g.fillRect(0, 0, W, H);
  const horizon = g.createRadialGradient(W / 2, H + 40, 0, W / 2, H + 40, H * 0.6);
  horizon.addColorStop(0, 'rgba(255,92,138,0.35)');
  horizon.addColorStop(1, 'rgba(255,92,138,0)');
  g.fillStyle = horizon;
  g.fillRect(0, 0, W, H);
  return c;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function loadBest() {
  try { return Number(localStorage.getItem('dodge-best')) || 0; } catch { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('dodge-best', v); } catch {}
}

// Three parallax star layers.
const stars = [];
function makeStars() {
  stars.length = 0;
  for (let i = 0; i < 90; i++) {
    const layer = i % 3;
    stars.push({ x: Math.random(), y: Math.random(), layer, r: 0.6 + layer * 0.5, a: 0.25 + layer * 0.25 });
  }
}

const player = { x: 0, y: 0, size: 40, targetX: 0, vx: 0, trail: [] };
let blocks = [], particles = [], score = 0, best = loadBest(), newBest = false;
let state = 'menu', spawnTimer = 0, elapsed = 0, last = 0, time = 0;
let shake = 0, flash = 0, scorePop = 0, overTimer = 0;

function playerY() { return H - 110 - safeBottom; }

function reset() {
  player.x = player.targetX = W / 2;
  player.trail = [];
  blocks = [];
  particles = [];
  score = 0;
  spawnTimer = 0.4;
  elapsed = 0;
  newBest = false;
  state = 'play';
}

// Touch: drag anywhere, player follows finger horizontally.
function pointer(e) {
  const t = e.touches ? e.touches[0] : e;
  if (t) player.targetX = t.clientX;
}
function tap(e) {
  // Short delay after death so a finger still on the screen doesn't instantly restart.
  if (state === 'menu' || (state === 'over' && overTimer > 0.6)) reset();
  pointer(e);
}
canvas.addEventListener('touchstart', e => { e.preventDefault(); tap(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); pointer(e); }, { passive: false });
// Mouse for desktop testing.
canvas.addEventListener('mousedown', tap);
canvas.addEventListener('mousemove', e => { if (e.buttons) pointer(e); });

function spawn() {
  const size = 22 + Math.random() * 38;
  blocks.push({
    x: size / 2 + Math.random() * (W - size),
    y: -size,
    size,
    v: 180 + elapsed * 12 + Math.random() * 120,
    rot: Math.random() * Math.PI,
    spin: (Math.random() - 0.5) * 3,
    color: COLORS.blocks[Math.floor(Math.random() * COLORS.blocks.length)],
  });
}

function burst(x, y, color, count, power) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = power * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: 0.8 + Math.random() * 1.2, size: 2 + Math.random() * 4, color });
  }
}

function die() {
  state = 'over';
  overTimer = 0;
  shake = 18;
  flash = 1;
  burst(player.x, player.y, COLORS.player, 60, 420);
  burst(player.x, player.y, '#ffffff', 20, 250);
  if (Math.floor(score) > best) {
    best = Math.floor(score);
    newBest = true;
    saveBest(best);
  }
}

function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 60);
  flash = Math.max(0, flash - dt * 3);
  scorePop = Math.max(0, scorePop - dt * 4);

  // Game speed drives star speed so the background feels faster too.
  const speed = state === 'play' ? 1 + elapsed * 0.06 : 0.5;
  for (const s of stars) {
    s.y += dt * (0.02 + s.layer * 0.03) * speed;
    if (s.y > 1) { s.y -= 1; s.x = Math.random(); }
  }

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.96;
    p.vy *= 0.96;
    p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);

  if (state === 'over') {
    overTimer += dt;
    for (const b of blocks) { b.y += b.v * dt * 0.25; b.rot += b.spin * dt * 0.25; }
    return;
  }
  if (state !== 'play') return;

  elapsed += dt;
  const before = Math.floor(score / 100);
  score += dt * 10;
  if (Math.floor(score / 100) > before) scorePop = 1;

  const prevX = player.x;
  player.x += (player.targetX - player.x) * Math.min(1, dt * 18);
  player.x = Math.max(player.size / 2, Math.min(W - player.size / 2, player.x));
  player.y = playerY();
  player.vx = (player.x - prevX) / Math.max(dt, 0.001);
  player.trail.unshift({ x: player.x, y: player.y });
  if (player.trail.length > 8) player.trail.pop();

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawn();
    spawnTimer = Math.max(0.18, 0.8 - elapsed * 0.02);
  }

  // Hitboxes are slightly smaller than the drawn shapes, near misses feel fair.
  const ph = player.size * 0.38;
  for (const b of blocks) {
    b.y += b.v * dt;
    b.rot += b.spin * dt;
    const bh = b.size * 0.4;
    if (Math.abs(player.x - b.x) < ph + bh && Math.abs(player.y - b.y) < ph + bh) {
      die();
      break;
    }
  }
  blocks = blocks.filter(b => b.y < H + 100);
}

function text(str, x, y, size, color = COLORS.text, weight = 700, align = 'center') {
  ctx.fillStyle = color;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}

function drawGlow(x, y, color, radius, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(glow(color), x - radius, y - radius, radius * 2, radius * 2);
  ctx.globalAlpha = 1;
}

function drawBlock(b) {
  drawGlow(b.x, b.y, b.color, b.size * 1.3, 0.8);
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot);
  const s = b.size;
  roundRect(-s / 2, -s / 2, s, s, s * 0.22);
  ctx.fillStyle = b.color;
  ctx.fill();
  // Top highlight for a bit of depth.
  roundRect(-s / 2 + 3, -s / 2 + 3, s - 6, s * 0.35, s * 0.15);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  const s = player.size;
  ctx.globalCompositeOperation = 'lighter';
  player.trail.forEach((t, i) => {
    const k = 1 - i / player.trail.length;
    ctx.globalAlpha = k * 0.25;
    roundRect(t.x - s * k / 2, t.y - s * k / 2 + i * 3, s * k, s * k, s * 0.3 * k);
    ctx.fillStyle = COLORS.player;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  drawGlow(player.x, player.y, COLORS.player, s * 1.8, 0.9 + Math.sin(time * 6) * 0.1);
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(Math.max(-0.35, Math.min(0.35, player.vx / 2000)));
  roundRect(-s / 2, -s / 2, s, s, s * 0.3);
  ctx.fillStyle = COLORS.player;
  ctx.fill();
  roundRect(-s / 2 + 5, -s / 2 + 5, s - 10, s - 10, s * 0.22);
  ctx.fillStyle = '#c9fbff';
  ctx.fill();
  // Eyes, a small bit of character.
  ctx.fillStyle = '#0b0b1a';
  const look = Math.max(-3, Math.min(3, player.vx / 200));
  ctx.beginPath();
  ctx.arc(-7 + look, -2, 3.2, 0, Math.PI * 2);
  ctx.arc(7 + look, -2, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawStars() {
  for (const s of stars) {
    ctx.globalAlpha = s.a * (0.7 + 0.3 * Math.sin(time * 2 + s.x * 20));
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function button(label, y) {
  const w = 200, h = 56, x = W / 2 - w / 2;
  const pulse = 1 + Math.sin(time * 4) * 0.03;
  ctx.save();
  ctx.translate(W / 2, y);
  ctx.scale(pulse, pulse);
  ctx.translate(-W / 2, -y);
  drawGlow(W / 2, y, COLORS.player, 110, 0.5);
  roundRect(x, y - h / 2, w, h, h / 2);
  ctx.fillStyle = COLORS.player;
  ctx.fill();
  text(label, W / 2, y + 1, 20, '#0b0b1a', 800);
  ctx.restore();
}

function drawMenu() {
  const cy = H * 0.42;
  drawGlow(W / 2, cy - 30, '#ff5c8a', 180, 0.5);
  text('DODGE', W / 2, cy - 30, 64, COLORS.text, 900);
  text('Drag to move. Avoid the blocks.', W / 2, cy + 25, 16, COLORS.dim, 500);
  button('PLAY', cy + 110);
  if (best) text(`BEST  ${best}`, W / 2, cy + 175, 14, COLORS.dim, 700);
}

function drawHud() {
  const y = safeTop + 40;
  const size = 44 * (1 + scorePop * 0.35);
  text(Math.floor(score), W / 2, y, size, scorePop > 0 ? COLORS.blocks[2] : COLORS.text, 900);
  if (best) text(`BEST ${best}`, W / 2, y + 34, 12, COLORS.dim, 700);
}

function drawGameOver() {
  const t = Math.min(1, overTimer * 3);
  const ease = 1 - Math.pow(1 - t, 3);
  ctx.fillStyle = `rgba(8,8,20,${0.55 * ease})`;
  ctx.fillRect(0, 0, W, H);

  const cw = Math.min(300, W - 48), ch = 260;
  const cx = W / 2 - cw / 2, cy = H / 2 - ch / 2 + (1 - ease) * 60;
  ctx.globalAlpha = ease;
  roundRect(cx, cy, cw, ch, 24);
  ctx.fillStyle = 'rgba(30,26,64,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();

  text('GAME OVER', W / 2, cy + 40, 16, COLORS.dim, 800);
  text(Math.floor(score), W / 2, cy + 95, 64, COLORS.text, 900);
  if (newBest) {
    roundRect(W / 2 - 55, cy + 135, 110, 26, 13);
    ctx.fillStyle = COLORS.blocks[2];
    ctx.fill();
    text('NEW BEST!', W / 2, cy + 149, 13, '#0b0b1a', 900);
  } else {
    text(`BEST  ${best}`, W / 2, cy + 148, 14, COLORS.dim, 700);
  }
  if (overTimer > 0.6) button('RETRY', cy + 210);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.drawImage(bg, 0, 0, W, H);
  drawStars();

  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // Floor line under the player lane.
  const floorY = playerY() + 40;
  const floor = ctx.createLinearGradient(0, 0, W, 0);
  floor.addColorStop(0, 'rgba(62,240,255,0)');
  floor.addColorStop(0.5, 'rgba(62,240,255,0.35)');
  floor.addColorStop(1, 'rgba(62,240,255,0)');
  ctx.fillStyle = floor;
  ctx.fillRect(0, floorY, W, 2);

  if (state === 'menu') {
    // Idle blocks drifting behind the title.
    if (Math.random() < 0.03) { elapsed = 0; spawn(); blocks[blocks.length - 1].v *= 0.4; }
    for (const b of blocks) { b.y += b.v / 60; b.rot += b.spin / 60; }
    blocks = blocks.filter(b => b.y < H + 100);
    ctx.globalAlpha = 0.5;
    blocks.forEach(drawBlock);
    ctx.globalAlpha = 1;
  } else {
    blocks.forEach(drawBlock);
    if (state === 'play') drawPlayer();
    drawParticles();
  }
  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.5})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === 'menu') drawMenu();
  if (state === 'play') drawHud();
  if (state === 'over') drawGameOver();
}

function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
makeStars();
requestAnimationFrame(loop);

// Offline support. Only registers over https or localhost.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
